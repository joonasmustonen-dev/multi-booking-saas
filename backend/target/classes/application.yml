spring:
  application:
    name: booking-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/platform_db
    username: booking
    password: booking
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true



server:
  port: 8080

app:
  tenant-database:
    host: localhost
    port: 5432
    username: booking
    password: booking
  security: 
    jwt-enabled: false